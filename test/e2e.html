<!DOCTYPE html>
<!--
  End-to-end check of the real page in a browser. Loads ../index.html in an
  iframe and drives it the way a user would: file picker upload, drag & drop,
  sample files, column strategy, and both downloads. Results are written into
  #results as PASS/FAIL lines. Run via test/run-e2e.sh (headless Chrome).
-->
<html>
<head><meta charset="utf-8"><title>e2e</title></head>
<body>
<pre id="results">RUNNING</pre>
<script>
(async function () {
  const out = [];
  const resultsEl = document.getElementById("results");
  const ok = (name, cond, detail) => {
    out.push((cond ? "PASS - " : "FAIL - ") + name + (cond || !detail ? "" : " :: " + detail));
    resultsEl.textContent = "RUNNING (unfinished)\n" + out.join("\n"); // partial progress if it times out
  };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function until(fn, ms = 4000) {
    const end = Date.now() + ms;
    while (Date.now() < end) { try { if (fn()) return true; } catch (e) {} await sleep(25); }
    return false;
  }
  function loadFrameEl(width, src) {
    return new Promise((resolve) => {
      const f = document.createElement("iframe");
      f.style.width = width + "px";
      f.style.height = "900px";
      f.onload = () => { f.onload = null; resolve(f); };
      f.src = src || "../index.html";
      document.body.appendChild(f);
    });
  }
  async function loadFrame(width, src) {
    return (await loadFrameEl(width, src)).contentWindow;
  }
  async function fixtureFile(path) {
    const res = await fetch("../test-fixtures/" + path);
    return new File([await res.arrayBuffer()], path.split("/").pop());
  }

  try {
    const w = await loadFrame(1280);
    const d = w.document;
    // Capture Umami events instead of sending them.
    const events = [];
    w.umami = { track: (name, data) => events.push({ name, data }) };
    const $ = (id) => d.getElementById(id);
    const visible = (id) => !$(id).classList.contains("hidden");
    const tableText = () => $("preview-table").textContent;
    const headers = () => Array.from(d.querySelectorAll("#preview-table th")).map((th) => th.textContent);
    const chipNums = () => Array.from(d.querySelectorAll("#summary-chips strong")).map((s) => Number(s.textContent));

    // --- Page basics ---
    ok("scripts loaded from relative paths", typeof w.XLSX === "object" && typeof w.TM === "object");
    ok("stylesheet applied (H1 is white)", w.getComputedStyle(d.querySelector("h1")).color === "rgb(255, 255, 255)");
    ok("H1 copy", d.querySelector("h1").textContent.trim() === "Combine every tab from every workbook into one sheet.");
    ok("exactly one h1", d.querySelectorAll("h1").length === 1);
    ok("title", d.title === "StackMySheets – Combine Excel Tabs & Files Into One Sheet");
    ok("no tabmerger references in page", !/tabmerger/i.test(d.documentElement.outerHTML));
    ok("5 FAQ items", d.querySelectorAll(".faq details summary").length === 5);
    ok("dropzone focusable", $("dropzone").tabIndex === 0);

    // --- Picker wiring: count how often each hidden input gets opened ---
    const fileInput = $("file-input"), folderInput = $("folder-input");
    let filePicks = 0, folderPicks = 0;
    fileInput.click = () => { filePicks++; };
    folderInput.click = () => { folderPicks++; };
    $("choose-files-btn").click();
    ok("Choose files opens file picker once", filePicks === 1 && folderPicks === 0, `file=${filePicks} folder=${folderPicks}`);
    filePicks = folderPicks = 0;
    $("browse-folder").click();
    ok("browse a folder opens folder picker only", filePicks === 0 && folderPicks === 1, `file=${filePicks} folder=${folderPicks}`);
    filePicks = folderPicks = 0;
    $("browse-folder").dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    ok("Enter on folder link doesn't open file picker", filePicks === 0);
    $("dropzone").dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    ok("Enter on dropzone opens file picker", filePicks === 1);
    filePicks = 0;
    d.querySelector(".dropzone-text").click();
    ok("click on dropzone background opens file picker", filePicks === 1);
    delete fileInput.click; delete folderInput.click;

    // --- Drag-over highlight ---
    const dz = $("dropzone");
    dz.dispatchEvent(new w.DragEvent("dragenter", { bubbles: true, cancelable: true }));
    ok("dragover class on dragenter", dz.classList.contains("dragover"));
    dz.dispatchEvent(new w.DragEvent("dragleave", { bubbles: true, relatedTarget: $("choose-files-btn") }));
    ok("highlight kept when moving onto child", dz.classList.contains("dragover"));
    dz.dispatchEvent(new w.DragEvent("dragleave", { bubbles: true, relatedTarget: d.body }));
    ok("highlight removed when leaving zone", !dz.classList.contains("dragover"));

    // --- Upload via file picker (real fixture files) ---
    const monthFiles = await Promise.all(["multi_month_folder/april.xlsx", "multi_month_folder/may.xlsx", "multi_month_folder/june.csv"].map(fixtureFile));
    const dt = new w.DataTransfer();
    monthFiles.forEach((f) => dt.items.add(new w.File([f], f.name)));
    fileInput.files = dt.files;
    fileInput.dispatchEvent(new w.Event("change", { bubbles: true }));
    await until(() => visible("results-panel"));
    ok("picker upload: results shown", visible("results-panel"));
    ok("picker upload: rows from all 3 files", ["Umbrella Corp", "Soylent Inc", "Stark Industries"].every((t) => tableText().includes(t)), tableText().slice(0, 200));
    ok("picker upload: union keeps Notes column", headers().includes("Notes"), headers().join("|"));
    ok("picker upload: 3 file groups listed", d.querySelectorAll(".file-group").length === 3);

    // --- Clear all ---
    $("clear-all-btn").click();
    ok("clear all hides panels", !visible("sheets-panel") && !visible("results-panel"));

    // --- Drag & drop (files fallback path) ---
    const qr = await fixtureFile("quarterly_report.xlsx");
    const drop = new w.Event("drop", { bubbles: true, cancelable: true });
    Object.defineProperty(drop, "dataTransfer", { value: { files: [new w.File([qr], qr.name)] } });
    dz.dispatchEvent(drop);
    await until(() => visible("results-panel"));
    ok("drop upload: results shown", visible("results-panel"));
    ok("drop upload: rows present", tableText().includes("Acme Co") && tableText().includes("Globex"));
    $("clear-all-btn").click();

    // --- Sample files ---
    $("sample-btn").click();
    await until(() => visible("results-panel") && d.querySelectorAll(".file-group").length === 3);
    const groupNames = Array.from(d.querySelectorAll(".file-group-name")).map((e) => e.textContent);
    ok("samples: 3 files", JSON.stringify(groupNames) === JSON.stringify(["sales_q1.xlsx", "sales_q2.xlsx", "june_sales.csv"]), groupNames.join("|"));
    ok("samples: 6 sheets, 18 rows, 7 columns", JSON.stringify(chipNums()) === "[6,18,7]", JSON.stringify(chipNums()));
    ok("samples: union columns", headers().join("|") === "source_file|source_sheet|Region|Rep|Units|Revenue|Notes", headers().join("|"));
    const mayAvery = Array.from(d.querySelectorAll("#preview-table tbody tr"))
      .map((tr) => Array.from(tr.children).map((td) => td.textContent))
      .find((r) => r[1] === "May" && r[3] === "Avery");
    ok("samples: reordered May columns matched by name", mayAvery && mayAvery[2] === "North" && mayAvery[4] === "45" && mayAvery[5] === "9000", JSON.stringify(mayAvery));
    ok("samples: header comparison flags Notes", $("header-comparison").textContent.includes("Notes"));
    $("sample-btn").click();
    ok("samples: button disabled while loading", $("sample-btn").disabled);
    $("sample-btn").click(); // ignored while disabled
    await until(() => !$("sample-btn").disabled && JSON.stringify(chipNums()) === "[6,18,7]");
    const groupNames2 = Array.from(d.querySelectorAll(".file-group-name")).map((e) => e.textContent);
    ok("samples twice: replaced, not duplicated", JSON.stringify(groupNames2) === JSON.stringify(groupNames) && JSON.stringify(chipNums()) === "[6,18,7]", groupNames2.join("|") + " " + JSON.stringify(chipNums()));

    $("strategy-intersection").click();
    ok("intersection drops Notes", headers().join("|") === "source_file|source_sheet|Region|Rep|Units|Revenue", headers().join("|"));
    $("strategy-union").click();

    // --- Analytics events (no file names or contents) ---
    const merges = events.filter((e) => e.name === "merge_completed");
    ok("analytics: merge_completed once per load (picker, drop, 2x samples)", merges.length === 4, JSON.stringify(events));
    events.length = 0;
    $("strategy-intersection").click();
    $("strategy-union").click();
    ok("analytics: option changes don't fire merge_completed", events.length === 0, JSON.stringify(events));

    // --- Downloads ---
    let wbOut = null, wbName = null;
    const realWrite = w.XLSX.writeFile;
    w.XLSX.writeFile = (wb, name) => { wbOut = wb; wbName = name; };
    $("output-name").value = "my_report.xlsx";
    $("export-xlsx-btn").click();
    w.XLSX.writeFile = realWrite;
    const aoa = wbOut && w.XLSX.utils.sheet_to_json(wbOut.Sheets[wbOut.SheetNames[0]], { header: 1 });
    ok("xlsx export: filename", wbName === "my_report.xlsx", wbName);
    ok("xlsx export: header + 18 rows", aoa && aoa.length === 19 && aoa[0].join("|") === "source_file|source_sheet|Region|Rep|Units|Revenue|Notes", aoa && aoa.length);

    let blobOut = null;
    const realCreate = w.URL.createObjectURL;
    w.URL.createObjectURL = (b) => { blobOut = b; return "about:blank"; };
    const realAnchorClick = w.HTMLAnchorElement.prototype.click;
    let dlName = null;
    w.HTMLAnchorElement.prototype.click = function () { dlName = this.download; };
    $("export-csv-btn").click();
    w.URL.createObjectURL = realCreate;
    w.HTMLAnchorElement.prototype.click = realAnchorClick;
    const csv = blobOut ? await blobOut.text() : "";
    const csvLines = csv.trim().split("\n");
    ok("csv export: filename", dlName === "my_report.csv", dlName);
    ok("csv export: header + 18 rows", csvLines.length === 19 && csvLines[0] === "source_file,source_sheet,Region,Rep,Units,Revenue,Notes", csvLines.length + " " + csvLines[0]);
    ok("csv export: CSV notes carried through", csv.includes("Record month"));
    const dl = events.filter((e) => e.name === "download_clicked").map((e) => e.data && e.data.format);
    ok("analytics: download_clicked with format", JSON.stringify(dl) === '["xlsx","csv"]', JSON.stringify(events));
    const sent = JSON.stringify(events);
    ok("analytics: no file names or cell data sent", !/sales_|june|my_report|\.xlsx|\.csv|Avery|North/i.test(sent), sent);

    // --- Stack page: switch link appears once files are loaded ---
    ok("stack: switch-to-merge link shown after load", !$("switch-note").hidden);

    // ================= Merge into tabs =================
    const sameCells = (a, b) => {
      const problems = [];
      if ((a["!ref"] || "") !== (b["!ref"] || "")) problems.push(`ref ${a["!ref"]} vs ${b["!ref"]}`);
      new Set(Object.keys(a).concat(Object.keys(b))).forEach((k) => {
        if (k[0] === "!") return;
        const x = a[k], y = b[k];
        if (!x || !y) return problems.push(`${k} missing`);
        if (x.t !== y.t || x.v !== y.v) problems.push(`${k} ${JSON.stringify([x.t, x.v])} vs ${JSON.stringify([y.t, y.v])}`);
        else if (x.t === "n" && x.z && x.z !== "General" && x.z !== y.z) problems.push(`${k} format ${x.z} vs ${y.z}`);
      });
      return problems;
    };
    const FIXTURES = ["region_north.xlsx", "region_south.xlsx", "region_west.xlsx", "Budget [draft] v2.xlsx",
      "dupes/a/report.xlsx", "dupes/b/report.xlsx", "quarterly_regional_sales_report_2026.xlsx",
      "mac_1904_dates.xlsx", "customers export.csv"];
    const toolSources = await Promise.all(FIXTURES.map(async (p) => {
      const res = await fetch("../test-fixtures/tools/" + p.split("/").map(encodeURIComponent).join("/"));
      return { name: p.split("/").pop(), bytes: new Uint8Array(await res.arrayBuffer()) };
    }));
    const toolFiles = toolSources.map((t) => new File([t.bytes], t.name));

    // Capture downloads in a frame: blobs handed to URL.createObjectURL + the anchor's file name.
    function captureDownloads(win) {
      const got = [];
      let pendingBlob = null;
      win.URL.createObjectURL = (b) => { pendingBlob = b; return "about:blank"; };
      win.URL.revokeObjectURL = () => {};
      win.HTMLAnchorElement.prototype.click = function () { got.push({ name: this.download, blob: pendingBlob }); };
      return got;
    }
    function pick(win, files) {
      const input = win.document.getElementById("file-input");
      const dt = new win.DataTransfer();
      files.forEach((f) => dt.items.add(new win.File([f], f.name)));
      input.files = dt.files;
      input.dispatchEvent(new win.Event("change", { bubbles: true }));
    }

    const mw = await loadFrame(1280, "../merge-into-tabs");
    const md = mw.document;
    const mEvents = [];
    mw.umami = { track: (name, data) => mEvents.push({ name, data }) };
    const m$ = (id) => md.getElementById(id);
    const tabNamesShown = () => Array.from(md.querySelectorAll("#tab-order .tab-name")).map((e) => e.textContent);
    ok("merge: title", md.title === "Merge Excel Files Into One Workbook (Separate Tabs) – StackMySheets", md.title);
    ok("merge: one h1", md.querySelectorAll("h1").length === 1);
    ok("merge: canonical", md.querySelector('link[rel="canonical"]').href === "https://stackmysheets.com/merge-into-tabs");
    ok("merge: nav highlights current tool", md.querySelector('.tool-nav [aria-current="page"]').textContent === "Merge into tabs");
    ok("merge: privacy note shown", md.querySelector(".privacy-note").textContent.includes("never leave your browser"));

    pick(mw, toolFiles);
    await until(() => tabNamesShown().length >= 13);
    const tabNames = tabNamesShown();
    ok("merge: 13 tabs (empty tab unchecked)", tabNames.length === 13, tabNames.join(" | "));
    ok("merge: names within 31 chars, unique", tabNames.every((n) => n.length <= 31) && new Set(tabNames.map((n) => n.toLowerCase())).size === tabNames.length, tabNames.join(" | "));
    ok("merge: name rules applied", ["region_north", "Budget -draft- v2", "report", "report (2)", "quarterly_regional_sa - January", "customers export"].every((n) => tabNames.includes(n)), tabNames.join(" | "));
    ok("merge: 'Empty' tab listed but unchecked", Array.from(md.querySelectorAll(".sheet-row")).some((r) => r.textContent.includes("Empty") && !r.querySelector("input").checked));

    // Reorder: move the first tab down, focus stays on the moved tab's button
    md.querySelector('#tab-order .icon-btn[data-dir="1"]').click();
    ok("merge: move down swaps first two tabs", tabNamesShown()[0] === tabNames[1] && tabNamesShown()[1] === tabNames[0], tabNamesShown().slice(0, 2).join(" | "));
    ok("merge: focus follows moved tab", md.activeElement && md.activeElement.getAttribute("aria-label") === `Move ${tabNames[0]} down`, md.activeElement && md.activeElement.getAttribute("aria-label"));
    md.querySelectorAll("#tab-order .icon-btn[data-dir='-1']")[1].click();
    ok("merge: move up restores order", JSON.stringify(tabNamesShown()) === JSON.stringify(tabNames));
    ok("merge: first up / last down disabled", md.querySelector("#tab-order .icon-btn[data-dir='-1']").disabled && Array.from(md.querySelectorAll("#tab-order .icon-btn[data-dir='1']")).pop().disabled);

    // Uncheck / recheck a sheet
    const firstBox = md.querySelector(".sheet-row input");
    firstBox.click();
    ok("merge: unchecking removes tab", tabNamesShown().length === 12 && !tabNamesShown().includes("region_north"));
    firstBox.click();
    ok("merge: rechecking restores tab in place", JSON.stringify(tabNamesShown()) === JSON.stringify(tabNames));

    const mDownloads = captureDownloads(mw);
    m$("output-name").value = "all regions";
    m$("download-btn").click();
    ok("merge: downloads one .xlsx", mDownloads.length === 1 && mDownloads[0].name === "all regions.xlsx", JSON.stringify(mDownloads.map((d) => d.name)));
    const mergedBuf = await mDownloads[0].blob.arrayBuffer();
    const mergedWb = mw.TM.readWorkbook(new mw.Uint8Array(mergedBuf));
    ok("merge: workbook tabs match list order", JSON.stringify(mergedWb.SheetNames) === JSON.stringify(tabNames), mergedWb.SheetNames.join(" | "));

    // Compare every tab against the original file, parsed independently.
    // (Bytes made in this harness page are wrapped in the frame's own
    // Uint8Array; SheetJS doesn't recognize another page's ArrayBuffer.)
    const originals = [];
    for (const f of toolSources) {
      const isCsv = f.name.endsWith(".csv");
      const src = isCsv ? new TextDecoder().decode(f.bytes) : new mw.Uint8Array(f.bytes);
      const wb = mw.TM.readWorkbook(src, { isCsv });
      wb.SheetNames.forEach((n) => { if (Object.keys(wb.Sheets[n]).some((k) => k[0] !== "!")) originals.push(wb.Sheets[n]); });
    }
    const mergeProblems = [];
    originals.forEach((ws, i) => sameCells(ws, mergedWb.Sheets[tabNames[i]]).forEach((p) => mergeProblems.push(`${tabNames[i]}: ${p}`)));
    ok("merge: every cell matches the originals (values, types, formats)", originals.length === 13 && mergeProblems.length === 0, mergeProblems.slice(0, 5).join("; "));
    const north = mergedWb.Sheets.region_north;
    ok("merge: spot check — ID text, padded zip, date", north.A2.v === "00121" && north.B2.w === "02134" && north.C2.w === "2026-01-15", JSON.stringify([north.A2, north.B2, north.C2]));
    ok("merge: spot check — CSV leading zeros + date text", mergedWb.Sheets["customers export"].A2.v === "00123" && mergedWb.Sheets["customers export"].B2.v === "2026-01-15");
    ok("merge: spot check — 1904 date corrected", mergedWb.Sheets.mac_1904_dates.B2.w === "2026-01-15", JSON.stringify(mergedWb.Sheets.mac_1904_dates.B2));
    ok("merge: formulas dropped, values kept", mergedWb.Sheets.region_west.G2.v === 2469 && !Object.keys(mergedWb.Sheets).some((n) => Object.values(mergedWb.Sheets[n]).some((c) => c && c.f)));
    ok("merge: analytics event", JSON.stringify(mEvents) === JSON.stringify([{ name: "download_clicked", data: { tool: "merge", format: "xlsx" } }]), JSON.stringify(mEvents));

    // ================= Split =================
    const sw = await loadFrame(1280, "../split");
    const sd = sw.document;
    const sEvents = [];
    sw.umami = { track: (name, data) => sEvents.push({ name, data }) };
    const s$ = (id) => sd.getElementById(id);
    const fileList = () => Array.from(sd.querySelectorAll("#file-name-list li")).map((e) => e.textContent);
    ok("split: title", sd.title === "Split Excel Tabs Into Separate Files – StackMySheets", sd.title);
    ok("split: canonical", sd.querySelector('link[rel="canonical"]').href === "https://stackmysheets.com/split");
    ok("split: nav highlights current tool", sd.querySelector('.tool-nav [aria-current="page"]').textContent === "Split workbook");

    pick(sw, [new File([await (await fetch("../test-fixtures/tools/customers%20export.csv")).arrayBuffer()], "customers export.csv")]);
    await until(() => s$("status-line").classList.contains("error"));
    ok("split: CSV rejected with explanation", s$("status-line").textContent.includes("only one sheet"), s$("status-line").textContent);

    // Round trip: split the workbook downloaded from Merge into tabs
    pick(sw, [new File([mergedBuf], "all regions.xlsx")]);
    await until(() => fileList().length === 13);
    ok("split: lists all 13 tabs as files", fileList().length === 13, fileList().join(" | "));
    ok("split: file names made safe", fileList().includes('quarterly_ - Q1 _Final_ _draft_.xlsx') && fileList().includes("report (2).xlsx"), fileList().join(" | "));
    const sDownloads = captureDownloads(sw);
    s$("download-btn").click();
    await until(() => sDownloads.length === 1);
    ok("split: one .zip download", sDownloads.length === 1 && sDownloads[0].name === "all regions - tabs.zip", JSON.stringify(sDownloads.map((d) => d.name)));
    const zip = await sw.JSZip.loadAsync(await sDownloads[0].blob.arrayBuffer());
    const zipNames = Object.keys(zip.files);
    ok("split: zip holds one .xlsx per tab, names as listed", JSON.stringify(zipNames.slice().sort()) === JSON.stringify(fileList().slice().sort()), zipNames.join(" | "));
    const splitProblems = [];
    for (let i = 0; i < fileList().length; i++) {
      const wb = sw.TM.readWorkbook(new sw.Uint8Array(await zip.file(fileList()[i]).async("arraybuffer")));
      if (wb.SheetNames[0] !== tabNames[i]) splitProblems.push(`${fileList()[i]} tab name ${wb.SheetNames[0]}`);
      sameCells(originals[i], wb.Sheets[wb.SheetNames[0]]).forEach((p) => splitProblems.push(`${fileList()[i]}: ${p}`));
    }
    ok("split: round trip — every file matches the original sheet", splitProblems.length === 0, splitProblems.slice(0, 5).join("; "));
    ok("split: unicode file name survives zip", zipNames.some((n) => n.includes("Café São Paulo")), zipNames.join(" | "));

    s$("format-csv").click();
    ok("split: CSV names", fileList().every((n) => n.endsWith(".csv")));
    s$("download-btn").click();
    await until(() => sDownloads.length === 2);
    const csvZip = await sw.JSZip.loadAsync(await sDownloads[1].blob.arrayBuffer());
    const custCsv = await csvZip.file("customers export.csv").async("string");
    ok("split csv: leading zeros, dates, long IDs as written", custCsv.split("\n")[1] === '00123,2026-01-15,01/02/2026,1234.5,12345678901234567890,"1,234",Café', custCsv.split("\n")[1]);
    const northCsv = await csvZip.file("region_north.csv").async("string");
    ok("split csv: formatted values as displayed", northCsv.split("\n")[1].startsWith("00121,02134,2026-01-15"), northCsv.split("\n")[1]);

    // Single tab -> direct file, no zip
    s$("format-xlsx").click();
    Array.from(sd.querySelectorAll(".sheet-row input")).slice(1).forEach((b) => { if (b.checked) b.click(); });
    ok("split: one tab -> direct download label", s$("download-btn").textContent === "Download region_north.xlsx", s$("download-btn").textContent);
    s$("download-btn").click();
    await until(() => sDownloads.length === 3);
    ok("split: one tab downloads .xlsx directly", sDownloads[2].name === "region_north.xlsx");
    ok("split: analytics events", JSON.stringify(sEvents.map((e) => e.data.format)) === '["xlsx","csv","xlsx"]' && sEvents.every((e) => e.name === "download_clicked" && e.data.tool === "split"), JSON.stringify(sEvents));

    s$("sample-btn").click();
    await until(() => fileList().length === 3);
    ok("split: sample workbook loads", fileList().join("|") === "Downtown.xlsx|Airport.xlsx|Online.xlsx", fileList().join("|"));

    // ================= Hand-off: Stack -> Merge into tabs =================
    const hf = await loadFrameEl(1280, "../index.html");
    hf.contentDocument.getElementById("sample-btn").click();
    await until(() => !hf.contentDocument.getElementById("switch-note").hidden);
    const navigated = new Promise((r) => { hf.onload = () => r(true); });
    hf.contentDocument.getElementById("switch-to-merge").click();
    const didNavigate = await Promise.race([navigated, sleep(8000).then(() => false)]);
    ok("handoff: link navigates to merge page", didNavigate, "no navigation within 8s; still at " + hf.contentWindow.location.pathname);
    const hw = hf.contentWindow;
    ok("handoff: landed on merge page", hw.location.pathname === "/merge-into-tabs", hw.location.pathname);
    await until(() => hw.document.querySelectorAll("#tab-order .tab-item").length === 6);
    ok("handoff: files carried over (6 tabs)", hw.document.querySelectorAll("#tab-order .tab-item").length === 6);
    ok("handoff: status says files came from Stack", hw.document.getElementById("status-line").textContent.startsWith("Brought over 3 files from Stack sheets."), hw.document.getElementById("status-line").textContent);
    ok("handoff: stored copy deleted after use", (await hw.SMS.takeHandoff()).length === 0);

    // ================= Nothing leaves the browser =================
    const frames = [w, mw, sw, hw];
    const external = [];
    frames.forEach((fw) => fw.performance.getEntriesByType("resource").forEach((e) => {
      const u = new URL(e.name);
      if (u.origin !== fw.location.origin && u.href !== "https://cloud.umami.is/script.js") external.push(u.href);
    }));
    ok("no requests to other servers (besides the Umami script)", external.length === 0, external.join(" "));

    // ================= Phone width (375px) =================
    for (const [page, loadBtn, readyId] of [["../index.html", "sample-btn", "results-panel"], ["../merge-into-tabs", "sample-btn", "tabs-panel"], ["../split", "sample-btn", "output-panel"]]) {
      const pw = await loadFrame(375, page);
      pw.document.getElementById(loadBtn).click();
      await until(() => !pw.document.getElementById(readyId).classList.contains("hidden"));
      await sleep(200);
      const de = pw.document.documentElement;
      ok(`375px ${page}: no horizontal scroll (with content)`, de.scrollWidth <= de.clientWidth, `scrollWidth=${de.scrollWidth} clientWidth=${de.clientWidth}`);
      const stepsCols = pw.getComputedStyle(pw.document.querySelector(".steps")).gridTemplateColumns.split(" ").length;
      ok(`375px ${page}: steps stacked`, stepsCols === 1, String(stepsCols));
      const navTops = new Set(Array.from(pw.document.querySelectorAll(".tool-nav a")).map((a) => Math.round(a.getBoundingClientRect().top)));
      ok(`375px ${page}: nav fits on one row`, navTops.size === 1, [...navTops].join(","));
    }
  } catch (err) {
    ok("harness error", false, err && (err.stack || err.message || err));
  }

  const fails = out.filter((l) => l.startsWith("FAIL")).length;
  out.push(`\n${out.length - fails} passed, ${fails} failed`);
  document.getElementById("results").textContent = out.join("\n");
  document.title = "DONE";
})();
</script>
</body>
</html>
